name: image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
permissions:
  contents: read
jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless signing + provenance
      attestations: write    # GitHub attestation store
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', steps.vars.outputs.short) }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --- gate: scan the pushed digest; nothing below runs if a critical CVE is found
      - name: vulnerability scan (gate)
        uses: anchore/scan-action@v6            # v6.5.1
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0            # v0.20.x
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom.spdx.json
          upload-release-assets: false   # on tags it would try to attach to the release (needs contents: write); GoReleaser owns releases
      - uses: sigstore/cosign-installer@v4.1.2   # no floating v4 tag exists
        with:
          cosign-release: v3.1.3   # v3 stores signatures as OCI referrer bundles; keep client and CI on the same major
      - name: sign and attest (keyless)
        env:
          REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - name: SLSA provenance
        uses: actions/attest-build-provenance@v3 # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: |
          { echo "### image"; echo '```'; echo "${{ steps.meta.outputs.tags }}"; echo "digest ${{ steps.build.outputs.digest }}"; echo '```'
            echo "signed, SBOM attested, provenance attested (keyless)"; } >> "$GITHUB_STEP_SUMMARY"
