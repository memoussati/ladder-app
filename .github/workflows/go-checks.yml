name: go-checks
on:
  workflow_call:
    inputs:
      coverage-min:
        type: number
        default: 70
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8   # v8.0.0
        with:
          version: v2.14.0   # must be built with Go >= the go.mod version
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=cover.out ./...
      - uses: ./.github/actions/coverage
        with:
          min: ${{ inputs.coverage-min }}
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1       # v1.0.4
        with:
          go-version-file: go.mod
          go-package: ./...
