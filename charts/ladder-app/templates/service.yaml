apiVersion: v1
kind: Service
metadata:
  name: {{ include "ladder-app.fullname" . }}
  labels: {{- include "ladder-app.labels" . | nindent 4 }}
spec:
  selector: {{- include "ladder-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
